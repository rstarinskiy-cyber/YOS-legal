<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YOSS — Правовая информация и поддержка</title>
  <style>
    :root {
      --bg: #f7f7f2;
      --surface: #ffffff;
      --text: #111111;
      --muted: #6e6e73;
      --accent: #007f00;
      --rule: rgba(17, 17, 17, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 16px 48px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 32rem; margin: 0 auto; }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .lede {
      margin: 0 0 24px;
      font-size: 17px;
      line-height: 1.47;
      color: var(--muted);
    }
    .links a {
      display: block;
      padding: 16px;
      margin: 0 0 12px;
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--rule);
      color: var(--text);
      text-decoration: none;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .links a:hover { border-color: rgba(0, 127, 0, 0.35); }
    .lang {
      display: flex;
      gap: 12px;
      margin: 0 0 24px;
      font-size: 13px;
      color: var(--muted);
    }
    .lang a {
      color: var(--accent);
      text-decoration: none;
      padding: 0;
      background: none;
      border: none;
      margin: 0;
      display: inline;
      font-weight: 400;
    }
    .lang .active { font-weight: 600; color: var(--text); }

  </style>
</head>
<body>
  <main>
    <nav class="lang" aria-label="Язык">
      <a href="../">English</a>
      <span class="active">Русский</span>
    </nav>
    <h1>YOSS</h1>
    <p class="lede">Осознание текущего состояния дня для iOS.</p>
    <div class="links">
    <a href="support.html">Поддержка</a>
    <a href="privacy.html">Политика конфиденциальности</a>
    <a href="terms.html">Условия использования</a>
    </div>
  </main>
</body>
</html>
