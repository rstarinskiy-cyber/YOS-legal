<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YOS — Правовая информация и поддержка</title>
  <style>
    :root { --navy: #1e3a5f; --bg: #f5f5f7; --text: #1d1d1f; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 2rem 1.25rem; line-height: 1.5; }
    main { max-width: 520px; margin: 0 auto; }
    h1 { font-size: 1.5rem; color: var(--navy); margin-bottom: 0.5rem; }
    p { color: #6e6e73; margin-bottom: 1.5rem; }
    a { display: block; padding: 1rem 1.25rem; background: #fff; border-radius: 12px; color: var(--navy); text-decoration: none; margin-bottom: 0.75rem; border: 1px solid rgba(0,0,0,0.06); }
    a:hover { background: #fafafa; }
    .lang { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; font-size: 0.875rem; }
    .lang a { display: inline; padding: 0; background: none; border: none; margin: 0; }
    .lang .active { font-weight: 600; color: var(--navy); }
  </style>
</head>
<body>
  <main>
    <nav class="lang" aria-label="Язык">
      <a href="../">English</a>
      <span class="active">Русский</span>
    </nav>
    <h1>YOS</h1>
    <p>Осознание текущего состояния дня для iOS.</p>
    <a href="support.html">Поддержка</a>
    <a href="privacy.html">Политика конфиденциальности</a>
    <a href="terms.html">Условия использования</a>
  </main>
</body>
</html>
